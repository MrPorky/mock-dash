name: Release

on:
  push:
    branches: [main]
    paths:
      - packages/api/package.json
      - packages/db/package.json
      - packages/server/package.json
  workflow_dispatch:

jobs:
  release:
    name: Release ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - name: "@mock-dash/api"
            path: packages/api
          - name: "@mock-dash/adb"
            path: packages/db
          - name: "@mock-dash/server"
            path: packages/server
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_GITHUB_TOKEN }}

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Get package metadata
        id: package-meta
        run: |
          echo "version=$(node --input-type=module -e \"import pkg from './${{ matrix.package.path }}/package.json' with { type: 'json' }; console.log(pkg.version);\")" >> $GITHUB_OUTPUT
          echo "tag=${{ matrix.package.name }}@$(node --input-type=module -e \"import pkg from './${{ matrix.package.path }}/package.json' with { type: 'json' }; console.log(pkg.version);\")" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: tag-exists
        run: |
          if git rev-parse "${{ steps.package-meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run check
        if: steps.tag-exists.outputs.exists == 'false'
        working-directory: ${{ matrix.package.path }}
        run: vp check

      - name: Run tests
        if: steps.tag-exists.outputs.exists == 'false'
        working-directory: ${{ matrix.package.path }}
        run: vp test

      - name: Build package
        if: steps.tag-exists.outputs.exists == 'false'
        working-directory: ${{ matrix.package.path }}
        run: vp pack

      - name: Create Release
        if: steps.tag-exists.outputs.exists == 'false'
        run: |
          gh release create "${{ steps.package-meta.outputs.tag }}" \
            --title "${{ steps.package-meta.outputs.tag }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
