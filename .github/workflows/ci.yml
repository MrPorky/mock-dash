name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: ${{ matrix.package.name }} on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 25]
        package:
          - name: "@mock-dash/api"
            path: packages/api
          - name: "@mock-dash/adb"
            path: packages/db
          - name: "@mock-dash/server"
            path: packages/server

    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node-version }}
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Run check
        working-directory: ${{ matrix.package.path }}
        run: vp check

      - name: Run tests with coverage
        working-directory: ${{ matrix.package.path }}
        run: vp test --coverage

      - name: Build package
        working-directory: ${{ matrix.package.path }}
        run: vp pack
